[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "application-workflow"
version = "0.1.0"
description = "A staged portfolio edition of a local job application workflow."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
jobs = "job_system.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.package-data]
job_system = ["infrastructure/migrations/*.sql", "web/static/*.html", "web/static/*.js", "web/static/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
